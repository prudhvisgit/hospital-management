services:
  - type: web
    name: caresync-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromContext: MONGO_URI
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromContext: FRONTEND_URL
